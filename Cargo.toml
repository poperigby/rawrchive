[package]
name = "rawrchive"
version = "0.0.1"
edition = "2024"
description = "Pure safe Rust RAR5 extractor. No unRAR code!"
license = "GPL-3.0-or-later"
include = ["src/**", "Cargo.toml", "/README.md", "/LICENSE.md"]

[dependencies]
bitflags = "2.13.2"
crc32fast = "1.5.5"
thiserror = "2.0.21"

[dev-dependencies]
rstest = "0.28.0"
