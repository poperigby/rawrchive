[package]
name = "rawrchive"
version = "0.0.1"
edition = "2024"
description = "Pure safe Rust RAR5 extractor. No unRAR code!"
license = "GPL-3.0-or-later"
include = ["src/**", "Cargo.toml", "/README.md", "/LICENSE.md"]

[dependencies]
bitflags = "2.13.2"
crc32fast = "1.5.5"
nt-time = "0.15.0"
thiserror = "2.0.21"
tracing = "0.1.44"

[dev-dependencies]
pretty_assertions = "1.4.1"
rstest = "0.28.0"
